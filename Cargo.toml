[package]
name = "cogrrs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
winit = { version = "0.28", default-features = false }
wgpu = { version = "0.19", default-features = false, features = ["spirv"] }
wgpu-profiler = "0.14"
pollster = { version = "0.4", default-features = false }
bytemuck = { version = "1.7", default-features = false, features = ["derive"] }
inline-spirv = { version = "0.2", default-features = false, features = [
    "hlsl",
] }
#log = { version = "0.4", default-features = false }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = "0.3"
spirv-reflect = "0.2"
parking_lot = "0.12"
anyhow = "1.0"
shaderc = "0.8"
itertools = "0.13"

glam = { version = "0.24", features = ["bytemuck"] }
puffin = "0.17"
puffin_egui = "0.24"

egui = "0.24"
egui-wgpu = "0.24"
egui-winit = "0.24"

[profile.release]
debug = true

[patch.crates-io]
wgpu = { path = "../wgpu/wgpu" }
